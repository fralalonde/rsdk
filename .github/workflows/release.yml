name: Build and release rsdk

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            extension: zip
          - runner: ubuntu-22.04
            platform: linux
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
          - runner: macos-14
            platform: mac
            arch: aarch64
            target: aarch64-apple-darwin
            extension: tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Sanity checks (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/rsdk"
          "$bin" --version | grep -q 'rsdk '
          "$bin" --help >/dev/null
          cargo test
      - name: Assemble release tree
        shell: bash
        run: |
          set -euo pipefail
          root="stage/rsdk"
          mkdir -p "$root/bin" "$root/shell/bash" "$root/shell/zsh" "$root/shell/fish" "$root/shell/nushell"
          if [ "${{ matrix.platform }}" = windows ]; then cp "target/${{ matrix.target }}/release/rsdk.exe" "$root/bin/rsdk.exe"; else cp "target/${{ matrix.target }}/release/rsdk" "$root/bin/rsdk"; fi
          cp templates/bash/rsdk.bash "$root/shell/bash/rsdk.bash"
          cp templates/zsh/rsdk.zsh "$root/shell/zsh/rsdk.zsh"
          cp templates/fish/*.fish "$root/shell/fish/"
          cp templates/nushell/rsdk.nu "$root/shell/nushell/rsdk.nu"
          if [ "${{ matrix.platform }}" = windows ]; then mkdir -p "$root/shell/powershell"; cp templates/powershell/Rsdk.psd1 templates/powershell/Rsdk.psm1 "$root/shell/powershell/"; fi
          printf '%s\n' "${GITHUB_REF_NAME#v}" > "$root/VERSION"
          if command -v sha256sum >/dev/null 2>&1; then
            checksum() { sha256sum "$@"; }
          else
            checksum() { shasum -a 256 "$@"; }
          fi
          (cd "$root" && checksum bin/* shell/bash/* shell/zsh/* shell/fish/* shell/nushell/* VERSION > checksums.txt && if [ -d shell/powershell ]; then checksum shell/powershell/* >> checksums.txt; fi)
      - name: Archive release tree
        shell: bash
        run: |
          set -euo pipefail
          name="rsdk-${GITHUB_REF_NAME#v}-${{ matrix.platform }}-${{ matrix.arch }}"
          if [ "${{ matrix.extension }}" = zip ]; then (cd stage && 7z a "../$name.zip" rsdk); else tar -C stage -czf "$name.tar.gz" rsdk; fi
      # Every archive has this root layout: rsdk/bin/rsdk.exe (Windows) or rsdk/bin/rsdk,
      # rsdk/shell/bash/rsdk.bash, rsdk/shell/zsh/rsdk.zsh, rsdk/shell/fish/rsdk.fish,
      # rsdk/shell/nushell/rsdk.nu, rsdk/shell/powershell/Rsdk.psd1 (Windows only),
      # rsdk/shell/powershell/Rsdk.psm1 (Windows only), and rsdk/VERSION.
      - uses: actions/upload-artifact@v4
        with:
          name: rsdk-${{ matrix.platform }}-${{ matrix.arch }}
          path: rsdk-*-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.extension }}
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
          - runner: windows-2022
            platform: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Installer tests are platform-specific: POSIX scripts on Linux (they
      # self-skip elsewhere), PowerShell on Windows, none on macOS (assumed
      # identical to Linux).
      - name: Installer tests (POSIX)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sh test/test-release-installer-posix.sh
          sh test/test-release-installer-posix-integration.sh
      - name: Build binary for PowerShell integration test
        if: matrix.platform == 'windows'
        shell: bash
        run: cargo build --release
      - name: Prepare installed-binary fixture
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p "$HOME/.rsdk"
          cp target/release/rsdk.exe "$HOME/.rsdk/rsdk.exe"
      - name: Installer tests (PowerShell)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./test/test-release-installer-powershell.ps1
          ./test/test-release-installer-powershell-integration.ps1
  release:
    needs: [build, test]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Add installers and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install.ps1 release-assets/install.ps1
          (cd release-assets && sha256sum rsdk-* > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
